<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Xitoy tavar zakaz mini ilova</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}body{min-height:100vh}.header{position:sticky;top:0;z-index:10;background:#fff;padding:14px;box-shadow:0 1px 5px rgba(0,0,0,.08)}.head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:22px;font-weight:700;margin-bottom:10px}.admin-open{border:0;background:#111;color:#fff;border-radius:10px;padding:9px 11px;font-weight:700;cursor:pointer}.search{width:100%;height:42px;border:0;outline:0;border-radius:12px;background:#f0f1f3;padding:0 14px;font-size:15px}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px;padding-bottom:90px}.product{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}.product-image{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#eee}.product-info{padding:9px}.product-name{font-size:14px;font-weight:600;min-height:38px;line-height:19px;word-break:break-word}.quantity{display:flex;align-items:center;justify-content:space-between;margin-top:9px;border:1px solid #ddd;border-radius:9px;overflow:hidden;background:#fff}.quantity button{width:38px;height:34px;border:0;background:#f2f3f5;font-size:20px;cursor:pointer}.quantity-value{font-size:15px;font-weight:600}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;padding:10px 12px;box-shadow:0 -2px 10px rgba(0,0,0,.1)}.cart-button{width:100%;height:48px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:700}.loading,.empty,.error-box{grid-column:1/-1;text-align:center;padding:50px 20px;color:#777}.retry-button,.primary{margin-top:12px;border:0;border-radius:10px;padding:11px 16px;background:#111;color:#fff;font-weight:700;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.close{border:0;background:#eee;border-radius:9px;width:36px;height:36px;font-size:20px}.field{width:100%;height:42px;border:1px solid #ddd;border-radius:10px;padding:0 12px;margin:6px 0 10px;font-size:15px}.admin-tabs{display:flex;gap:8px;margin:10px 0}.tab{border:0;border-radius:9px;padding:9px 12px;background:#eee;font-weight:700}.tab.active{background:#111;color:#fff}.admin-list{display:grid;gap:10px}.admin-card{display:flex;gap:10px;align-items:center;border:1px solid #eee;border-radius:12px;padding:9px}.admin-card img{width:70px;height:70px;object-fit:cover;border-radius:9px;background:#eee}.admin-card-main{flex:1;min-width:0}.admin-name{font-weight:700;word-break:break-word}.admin-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.small-btn{border:0;border-radius:8px;padding:7px 9px;font-weight:700;background:#eee}.danger{background:#fee}.file{margin:5px 0 10px;width:100%}.hint{font-size:12px;color:#777}.section{border-top:1px solid #eee;margin-top:14px;padding-top:14px}.hidden{display:none}.login-error{color:#c00;font-size:13px;margin-top:6px}.toast{position:fixed;left:14px;right:14px;bottom:75px;background:#111;color:#fff;padding:12px;border-radius:10px;z-index:200;text-align:center;display:none}.toast.show{display:block}
</style>
</head>
<body>
<div class="header">
  <div class="head-row"><div class="title">AziKom</div><button id="adminOpen" class="admin-open">⚙️ Admin</button></div>
  <input id="search" class="search" type="text" placeholder="Mahsulot qidirish..." autocomplete="off">
</div>
<div id="products" class="products"><div class="loading">Mahsulotlar yuklanmoqda...</div></div>
<div class="bottom"><button id="cartButton" class="cart-button">Savat — 0 ta</button></div>
<div id="loginModal" class="modal"><div class="modal-box">
  <div class="modal-head"><b>Admin kirish</b><button class="close" onclick="closeModal('loginModal')">×</button></div>
  <input id="login" class="field" placeholder="Login" autocomplete="username">
  <input id="password" class="field" type="password" placeholder="Parol" autocomplete="current-password">
  <button class="primary" onclick="adminLogin()">Kirish</button><div id="loginError" class="login-error"></div>
</div></div>
<div id="adminModal" class="modal"><div class="modal-box">
  <div class="modal-head"><b>Admin panel</b><button class="close" onclick="closeModal('adminModal')">×</button></div>
  <div class="admin-tabs"><button id="tabCatalog" class="tab active" onclick="showAdminTab('catalog')">Katalog</button><button id="tabTrash" class="tab" onclick="showAdminTab('trash')">🗑 Chiqindi</button></div>
  <div id="catalogTab">
    <div class="section"><b>Yangi mahsulot</b><input id="newName" class="field" placeholder="Mahsulot nomi"><input id="newPhoto" class="file" type="file" accept="image/*"><button class="primary" onclick="addProduct()">+ Mahsulot qo‘shish</button><div class="hint">Rasm kanalga yuborilmaydi. Telegram bot orqali texnik file_id olinadi.</div></div>
    <div class="section"><b>Mahsulotlar</b><div id="adminList" class="admin-list"></div></div>
  </div>
  <div id="trashTab" class="hidden"><div id="trashList" class="admin-list"></div></div>
</div></div>
<div id="toast" class="toast"></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#fff');tg.setBackgroundColor('#f4f5f7')}catch(e){}}
const API_BASE='https://xitoytavar.vercel.app';
let products=[];const cart={};let adminToken=localStorage.getItem('azikom_admin_token')||'';
const $=id=>document.getElementById(id);
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function closeModal(id){$(id).classList.remove('show')}
function openModal(id){$(id).classList.add('show')}
async function loadProducts(){
 $('products').innerHTML='<div class="loading">Mahsulotlar yuklanmoqda...</div>';
 try{const r=await fetch(API_BASE+'/api/products?t='+Date.now(),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'API xatosi');products=d.products||[];renderProducts()}catch(e){console.error(e);$('products').innerHTML='<div class="error-box">Mahsulotlarni yuklashda xatolik.<br><button class="retry-button" onclick="loadProducts()">Qayta urinish</button></div>'}}
function renderProducts(){const s=$('search').value.trim().toLowerCase();const list=products.filter(p=>String(p.name||'').toLowerCase().includes(s));if(!list.length){$('products').innerHTML='<div class="empty">Mahsulot topilmadi.</div>';updateCartButton();return}$('products').innerHTML=list.map(p=>{const q=Number(cart[p.id]||0);const img=API_BASE+'/api/image?file_id='+encodeURIComponent(p.photo_file_id);return `<div class="product"><img class="product-image" src="${img}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'"><div class="product-info"><div class="product-name">${esc(p.name)}</div><div class="quantity"><button onclick="changeQuantity(${Number(p.id)},-1)">−</button><span class="quantity-value" data-q="${Number(p.id)}">${q}</span><button onclick="changeQuantity(${Number(p.id)},1)">+</button></div></div></div>`}).join('');updateCartButton()}
function changeQuantity(id,c){const n=Number(cart[id]||0)+c;if(n<=0)delete cart[id];else cart[id]=n;const el=document.querySelector(`[data-q="${id}"]`);if(el)el.textContent=cart[id]||0;updateCartButton()}
function updateCartButton(){const n=Object.values(cart).reduce((a,b)=>a+Number(b),0);$('cartButton').textContent='Savat — '+n+' ta'}
$('search').addEventListener('input',renderProducts);
$('cartButton').addEventListener('click',sendOrder);
async function sendOrder(){const items=Object.entries(cart).map(([id,q])=>({id:Number(id),quantity:Number(q)}));if(!items.length){if(tg)tg.showAlert('Avval mahsulot miqdorini tanlang.');else alert('Avval mahsulot miqdorini tanlang.');return}if(!tg||!tg.initData){alert('Buyurtma faqat Telegram Mini App orqali beriladi.');return}try{$('cartButton').disabled=true;$('cartButton').textContent='Yuborilmoqda...';const r=await fetch(API_BASE+'/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items,initData:tg.initData})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Buyurtma yuborilmadi');Object.keys(cart).forEach(k=>delete cart[k]);updateCartButton();tg.showAlert('Buyurtma muvaffaqiyatli yuborildi.')}catch(e){console.error(e);if(tg)tg.showAlert(e.message||'Xatolik yuz berdi');else alert(e.message)}finally{$('cartButton').disabled=false;updateCartButton()}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('adminOpen').onclick=()=>adminToken?openAdmin():openModal('loginModal');
async function adminLogin(){const login=$('login').value.trim(),password=$('password').value;if(!login||!password){$('loginError').textContent='Login va parolni kiriting';return}$('loginError').textContent='';try{const r=await fetch(API_BASE+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,password})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Kirish xatosi');adminToken=d.token;localStorage.setItem('azikom_admin_token',adminToken);$('password').value='';closeModal('loginModal');openAdmin()}catch(e){$('loginError').textContent=e.message||'Login xatosi'}}
function authHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+adminToken}}
async function adminFetch(url,opt={}){const r=await fetch(API_BASE+url,{...opt,headers:{...authHeaders(),...(opt.headers||{})}});if(r.status===401){adminToken='';localStorage.removeItem('azikom_admin_token');closeModal('adminModal');openModal('loginModal');throw Error('Admin sessiyasi tugagan')}const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Xatolik');return d}
async function openAdmin(){openModal('adminModal');showAdminTab('catalog')}
function showAdminTab(tab){$('catalogTab').classList.toggle('hidden',tab!=='catalog');$('trashTab').classList.toggle('hidden',tab!=='trash');$('tabCatalog').classList.toggle('active',tab==='catalog');$('tabTrash').classList.toggle('active',tab==='trash');if(tab==='catalog')loadAdminList();else loadTrash()}
async function loadAdminList(){try{const d=await adminFetch('/api/admin/products');$('adminList').innerHTML=d.products.length?d.products.map(adminCard).join(''):'<div class="empty">Mahsulot yo‘q.</div>'}catch(e){$('adminList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function loadTrash(){try{const d=await adminFetch('/api/admin/products?trash=1');$('trashList').innerHTML=d.products.length?d.products.map(p=>adminCard(p,true)).join(''):'<div class="empty">Chiqindida mahsulot yo‘q.</div>'}catch(e){$('trashList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function adminCard(p,trash=false){const img=API_BASE+'/api/image?file_id='+encodeURIComponent(p.photo_file_id);return `<div class="admin-card"><img src="${img}" onerror="this.style.display='none'"><div class="admin-card-main"><div class="admin-name">${esc(p.name)}</div><div class="hint">ID: ${p.id}${p.channel_id==='admin'?' · Admin mahsulot':''}</div><div class="admin-actions">${trash?`<button class="small-btn" onclick="restoreProduct(${p.id})">♻️ Tiklash</button>`:`<button class="small-btn" onclick="editProduct(${p.id},${JSON.stringify(p.name)})">✏️ Tahrirlash</button><button class="small-btn danger" onclick="deleteProduct(${p.id})">🗑 O‘chirish</button>`}</div></div></div>`}
async function editProduct(id,oldName){const name=prompt('Yangi mahsulot nomi:',oldName);if(name===null)return;const n=name.trim();if(!n)return alert('Nom bo‘sh bo‘lmasin');try{await adminFetch('/api/admin/products?id='+id,{method:'PATCH',body:JSON.stringify({name:n})});toast('Mahsulot o‘zgartirildi');await loadAdminList();await loadProducts()}catch(e){alert(e.message)}}
async function deleteProduct(id){if(!confirm('Mahsulotni chiqindiga ko‘chirasizmi?'))return;try{await adminFetch('/api/admin/products?id='+id,{method:'DELETE'});toast('Chiqindiga ko‘chirildi');await loadAdminList();await loadProducts()}catch(e){alert(e.message)}}
async function restoreProduct(id){try{await adminFetch('/api/admin/products?id='+id,{method:'PATCH',body:JSON.stringify({action:'restore'})});toast('Mahsulot tiklandi');await loadTrash();await loadProducts()}catch(e){alert(e.message)}}
function compressImage(file,max=1600,quality=.82){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};im.onerror=reject;im.src=rd.result};rd.onerror=reject;rd.readAsDataURL(file)})}
async function addProduct(){const name=$('newName').value.trim(),file=$('newPhoto').files[0];if(!name||!file){alert('Nom va rasmni kiriting');return}try{const image=await compressImage(file);const chatId=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:'';if(!chatId)throw Error('Telegram foydalanuvchi ID topilmadi. Mini App ichidan oching.');const up=await adminFetch('/api/admin/upload',{method:'POST',body:JSON.stringify({chat_id:String(chatId),image})});await adminFetch('/api/admin/products',{method:'POST',body:JSON.stringify({name,photo_file_id:up.photo_file_id})});$('newName').value='';$('newPhoto').value='';toast('Mahsulot qo‘shildi');await loadAdminList();await loadProducts()}catch(e){alert(e.message)}}
loadProducts();
</script>
</body>
</html>
