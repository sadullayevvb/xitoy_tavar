<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Xitoy tavar zakaz mini ilova</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}body{min-height:100vh}.header{position:sticky;top:0;z-index:10;background:#fff;padding:14px;box-shadow:0 1px 5px rgba(0,0,0,.08)}.head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:22px;font-weight:700;margin-bottom:10px}.admin-open{border:0;background:#111;color:#fff;border-radius:10px;padding:9px 11px;font-weight:700}.search{width:100%;height:42px;border:0;border-radius:12px;background:#f0f1f3;padding:0 14px;font-size:15px;outline:0}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px;padding-bottom:90px}.product{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}.product-image{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee}.product-info{padding:9px}.product-name{font-size:14px;font-weight:600;min-height:38px;line-height:19px;word-break:break-word}.stock{font-size:12px;color:#777;margin-top:5px}.quantity{display:flex;align-items:center;justify-content:space-between;margin-top:8px;border:1px solid #ddd;border-radius:9px;overflow:hidden}.quantity button{width:38px;height:34px;border:0;background:#f2f3f5;font-size:20px}.quantity button:disabled{opacity:.35}.quantity-value{font-size:15px;font-weight:600}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;padding:10px 12px;box-shadow:0 -2px 10px rgba(0,0,0,.1)}.cart-button{width:100%;height:48px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:700}.loading,.empty,.error-box{grid-column:1/-1;text-align:center;padding:50px 20px;color:#777}.retry-button,.primary{margin-top:12px;border:0;border-radius:10px;padding:11px 16px;background:#111;color:#fff;font-weight:700}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{border:0;background:#eee;border-radius:9px;width:36px;height:36px;font-size:20px}.field{width:100%;height:42px;border:1px solid #ddd;border-radius:10px;padding:0 12px;margin:6px 0 10px;font-size:15px}.admin-tabs{display:flex;gap:8px;margin:10px 0}.tab{border:0;border-radius:9px;padding:9px 12px;background:#eee;font-weight:700}.tab.active{background:#111;color:#fff}.admin-list{display:grid;gap:10px}.admin-card{display:flex;gap:10px;align-items:flex-start;border:1px solid #eee;border-radius:12px;padding:9px}.admin-card img{width:70px;height:70px;object-fit:cover;border-radius:9px;background:#eee}.admin-card-main{flex:1;min-width:0}.admin-name{font-weight:700;word-break:break-word}.admin-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.small-btn{border:0;border-radius:8px;padding:7px 9px;font-weight:700;background:#eee}.danger{background:#fee}.file{margin:5px 0 10px;width:100%}.hint{font-size:12px;color:#777}.section{border-top:1px solid #eee;margin-top:14px;padding-top:14px}.hidden{display:none}.login-error{color:#c00;font-size:13px}.stock-edit{display:flex;gap:6px;align-items:center;margin-top:7px}.stock-input{width:90px;height:34px;border:1px solid #ddd;border-radius:8px;padding:0 8px}.toast{position:fixed;left:14px;right:14px;bottom:75px;background:#111;color:#fff;padding:12px;border-radius:10px;z-index:200;text-align:center;display:none}.toast.show{display:block}.muted{color:#888;font-size:12px}
</style>
</head>
<body>
<div class="header"><div class="head-row"><div class="title">AziKom</div><button id="adminOpen" class="admin-open">⚙️ Admin</button></div><input id="search" class="search" placeholder="Mahsulot qidirish..." autocomplete="off"></div>
<div id="products" class="products"><div class="loading">Mahsulotlar yuklanmoqda...</div></div>
<div class="bottom"><button id="cartButton" class="cart-button">Savat — 0 ta</button></div>
<div id="loginModal" class="modal"><div class="modal-box"><div class="modal-head"><b>Admin kirish</b><button class="close" onclick="closeModal('loginModal')">×</button></div><input id="login" class="field" placeholder="Login"><input id="password" class="field" type="password" placeholder="Parol"><button class="primary" onclick="adminLogin()">Kirish</button><div id="loginError" class="login-error"></div></div></div>
<div id="adminModal" class="modal"><div class="modal-box"><div class="modal-head"><b>Admin panel</b><button class="close" onclick="closeModal('adminModal')">×</button></div><div class="admin-tabs"><button id="tabCatalog" class="tab active" onclick="showAdminTab('catalog')">Katalog</button><button id="tabTrash" class="tab" onclick="showAdminTab('trash')">🗑 Chiqindi</button></div><div id="catalogTab"><div class="section"><b>Yangi mahsulot</b><input id="newName" class="field" placeholder="Mahsulot nomi"><input id="newStock" class="field" type="number" min="0" step="1" placeholder="Qoldiq soni"><input id="newPhoto" class="file" type="file" accept="image/*"><button class="primary" onclick="addProduct()">+ Mahsulot qo‘shish</button><div class="hint">Qoldiq — omborda nechta borligi. 0 bo‘lsa mijoz + bosa olmaydi.</div></div><div class="section"><b>Mahsulotlar</b><div id="adminList" class="admin-list"></div></div></div><div id="trashTab" class="hidden"><div id="trashList" class="admin-list"></div></div></div></div>
<div id="editModal" class="modal"><div class="modal-box"><div class="modal-head"><b>Mahsulotni tahrirlash</b><button class="close" onclick="closeModal('editModal')">×</button></div><input id="editName" class="field" placeholder="Mahsulot nomi"><input id="editStock" class="field" type="number" min="0" step="1" placeholder="Qoldiq"><button class="primary" onclick="saveEdit()">Saqlash</button></div></div>
<div id="toast" class="toast"></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#fff');tg.setBackgroundColor('#f4f5f7')}catch(e){}}
const API_BASE='https://xitoytavar.vercel.app';let products=[];const cart={};let adminToken=localStorage.getItem('azikom_admin_token')||'';let editId=0;const $=id=>document.getElementById(id);
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function openModal(id){$(id).classList.add('show')}function closeModal(id){$(id).classList.remove('show')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function loadProducts(){try{const r=await fetch(API_BASE+'/api/products?t='+Date.now(),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'API xatosi');products=d.products||[];renderProducts()}catch(e){console.error(e);$('products').innerHTML='<div class="error-box">Mahsulotlarni yuklashda xatolik.<br><button class="retry-button" onclick="loadProducts()">Qayta urinish</button></div>'}}
function renderProducts(){const s=$('search').value.trim().toLowerCase();const list=products.filter(p=>String(p.name||'').toLowerCase().includes(s));if(!list.length){$('products').innerHTML='<div class="empty">Mahsulot topilmadi.</div>';updateCartButton();return}$('products').innerHTML=list.map(p=>{const q=Number(cart[p.id]||0),stock=Number(p.stock_qty||0),out=stock<=0,maxed=q>=stock,img=API_BASE+'/api/image?file_id='+encodeURIComponent(p.photo_file_id);return `<div class="product"><img class="product-image" src="${img}" alt="${esc(p.name)}" loading="lazy"><div class="product-info"><div class="product-name">${esc(p.name)}</div><div class="stock">Qoldiq: ${stock} dona</div><div class="quantity"><button onclick="changeQuantity(${p.id},-1)">−</button><span class="quantity-value" data-q="${p.id}">${q}</span><button ${out||maxed?'disabled':''} onclick="changeQuantity(${p.id},1)">+</button></div></div></div>`}).join('');updateCartButton()}
function changeQuantity(id,c){const p=products.find(x=>Number(x.id)===Number(id));if(!p)return;const stock=Number(p.stock_qty||0),old=Number(cart[id]||0),n=old+c;if(n<0)return;if(c>0&&n>stock){toast('Bu mahsulotdan qoldiq yetarli emas');return}if(n===0)delete cart[id];else cart[id]=n;const el=document.querySelector(`[data-q="${id}"]`);if(el)el.textContent=cart[id]||0;const card=el?.closest('.quantity');const plus=card?.querySelector('button:last-child');if(plus)plus.disabled=n>=stock;updateCartButton()}
function updateCartButton(){$('cartButton').textContent='Savat — '+Object.values(cart).reduce((a,b)=>a+Number(b),0)+' ta'}$('search').addEventListener('input',renderProducts);$('cartButton').addEventListener('click',sendOrder);
async function sendOrder(){const items=Object.entries(cart).map(([id,q])=>({id:Number(id),quantity:Number(q)}));if(!items.length){if(tg)tg.showAlert('Avval mahsulot miqdorini tanlang.');else alert('Avval mahsulot miqdorini tanlang.');return}if(!tg||!tg.initData){alert('Buyurtma faqat Telegram Mini App orqali beriladi.');return}try{$('cartButton').disabled=true;$('cartButton').textContent='Yuborilmoqda...';const r=await fetch(API_BASE+'/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items,initData:tg.initData})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Buyurtma yuborilmadi');Object.keys(cart).forEach(k=>delete cart[k]);await loadProducts();updateCartButton();tg.showAlert('Buyurtma muvaffaqiyatli yuborildi.')}catch(e){await loadProducts();if(tg)tg.showAlert(e.message||'Xatolik yuz berdi');else alert(e.message)}finally{$('cartButton').disabled=false;updateCartButton()}}
$('adminOpen').onclick=()=>adminToken?openAdmin():openModal('loginModal');
async function adminLogin(){const login=$('login').value.trim(),password=$('password').value;if(!login||!password){$('loginError').textContent='Login va parolni kiriting';return}try{const r=await fetch(API_BASE+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,password})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Kirish xatosi');adminToken=d.token;localStorage.setItem('azikom_admin_token',adminToken);$('password').value='';closeModal('loginModal');openAdmin()}catch(e){$('loginError').textContent=e.message}}
function authHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+adminToken}}async function adminFetch(url,opt={}){const r=await fetch(API_BASE+url,{...opt,headers:{...authHeaders(),...(opt.headers||{})}});if(r.status===401){adminToken='';localStorage.removeItem('azikom_admin_token');closeModal('adminModal');openModal('loginModal');throw Error('Admin sessiyasi tugagan')}const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Xatolik');return d}
async function openAdmin(){openModal('adminModal');showAdminTab('catalog')}function showAdminTab(t){$('catalogTab').classList.toggle('hidden',t!=='catalog');$('trashTab').classList.toggle('hidden',t!=='trash');$('tabCatalog').classList.toggle('active',t==='catalog');$('tabTrash').classList.toggle('active',t==='trash');t==='catalog'?loadAdminList():loadTrash()}
async function loadAdminList(){try{const d=await adminFetch('/api/admin/products');const a=(d.products||[]).filter(p=>p.is_deleted!==true);$('adminList').innerHTML=a.length?a.map(p=>adminCard(p,false)).join(''):'<div class="empty">Mahsulot yo‘q.</div>'}catch(e){$('adminList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function loadTrash(){try{const d=await adminFetch('/api/admin/products?trash=1');const a=(d.products||[]).filter(p=>p.is_deleted===true);$('trashList').innerHTML=a.length?a.map(p=>adminCard(p,true)).join(''):'<div class="empty">Chiqindida mahsulot yo‘q.</div>'}catch(e){$('trashList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function adminCard(p,trash){const img=API_BASE+'/api/image?file_id='+encodeURIComponent(p.photo_file_id);if(trash)return `<div class="admin-card"><img src="${img}"><div class="admin-card-main"><div class="admin-name">${esc(p.name)}</div><div class="hint">ID: ${p.id} · Qoldiq: ${p.stock_qty} dona</div><div class="admin-actions"><button class="small-btn" onclick="restoreProduct(${p.id})">♻️ Tiklash</button></div></div></div>`;return `<div class="admin-card"><img src="${img}"><div class="admin-card-main"><div class="admin-name">${esc(p.name)}</div><div class="hint">ID: ${p.id}</div><div class="stock-edit"><span>Qoldiq:</span><input id="stock-${p.id}" class="stock-input" type="number" min="0" step="1" value="${Number(p.stock_qty||0)}"><button class="small-btn" onclick="saveStock(${p.id})">Saqlash</button></div><div class="admin-actions"><button class="small-btn" onclick="openEdit(${p.id})">✏️ Tahrirlash</button><button class="small-btn danger" onclick="deleteProduct(${p.id})">🗑 O‘chirish</button></div></div></div>`}
function openEdit(id){const p=products.find(x=>Number(x.id)===Number(id));editId=id;document.querySelectorAll('.admin-card').forEach(()=>{});fetchAdminProduct(id).then(p=>{$('editName').value=p.name;$('editStock').value=Number(p.stock_qty||0);openModal('editModal')}).catch(e=>alert(e.message))}
async function fetchAdminProduct(id){const d=await adminFetch('/api/admin/products?id='+id);const p=(d.products||[])[0];if(!p)throw Error('Mahsulot topilmadi');return p}
async function saveEdit(){const name=$('editName').value.trim(),stock=Number($('editStock').value);if(!name||!Number.isSafeInteger(stock)||stock<0){alert('Nom va qoldiqni to‘g‘ri kiriting');return}try{await adminFetch('/api/admin/products?id='+editId,{method:'PATCH',body:JSON.stringify({name,stock_qty:stock})});closeModal('editModal');toast('Mahsulot saqlandi');await loadAdminList();await loadProducts()}catch(e){alert(e.message)}}
async function saveStock(id){const el=$('stock-'+id),stock=Number(el.value);if(!Number.isSafeInteger(stock)||stock<0){alert('Qoldiq noto‘g‘ri');return}try{await adminFetch('/api/admin/products?id='+id,{method:'PATCH',body:JSON.stringify({stock_qty:stock})});toast('Qoldiq yangilandi');await loadAdminList();await loadProducts()}catch(e){alert(e.message)}}
async function deleteProduct(id){if(!confirm('Mahsulotni chiqindiga ko‘chirasizmi?'))return;try{await adminFetch('/api/admin/products?id='+id,{method:'DELETE'});toast('Chiqindiga ko‘chirildi');await loadAdminList();await loadTrash();await loadProducts()}catch(e){alert(e.message)}}
async function restoreProduct(id){try{await adminFetch('/api/admin/products?id='+id,{method:'PATCH',body:JSON.stringify({action:'restore'})});toast('Mahsulot tiklandi');await loadAdminList();await loadTrash();await loadProducts()}catch(e){alert(e.message)}}
function compressImage(file,max=1600,quality=.82){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};im.onerror=reject;im.src=rd.result};rd.onerror=reject;rd.readAsDataURL(file)})}
async function addProduct(){const name=$('newName').value.trim(),stock=Number($('newStock').value),file=$('newPhoto').files[0];if(!name||!file||!Number.isSafeInteger(stock)||stock<0){alert('Nom, rasm va qoldiqni kiriting');return}try{const image=await compressImage(file),chatId=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:'';if(!chatId)throw Error('Telegram foydalanuvchi ID topilmadi');const up=await adminFetch('/api/admin/upload',{method:'POST',body:JSON.stringify({chat_id:String(chatId),image})});await adminFetch('/api/admin/products',{method:'POST',body:JSON.stringify({name,photo_file_id:up.photo_file_id,stock_qty:stock})});$('newName').value='';$('newStock').value='';$('newPhoto').value='';toast('Mahsulot qo‘shildi');await loadAdminList();await loadProducts()}catch(e){alert(e.message)}}
loadProducts();
</script>
</body>
</html>
