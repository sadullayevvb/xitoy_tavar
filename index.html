-qty{display:flex;align-items:center;gap:8px;margin-top:7px}.cart-qty button{width:32px;height:32px;border-radius:8px}.cart-qty span{min-width:22px;text-align:center;font-weight:700}.cart-footer{background:#fff;padding:12px}.menu{background:#0007}.menu-box h3{margin-top:0}.menu-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.langs{display:flex;gap:7px;flex-wrap:wrap}.lang{border:0;border-radius:9px;padding:9px 11px;background:#eee}.lang.active{background:#111;color:#fff}.fly-img{position:fixed;z-index:300;width:80px;height:80px;object-fit:cover;border-radius:12px;pointer-events:none;transition:all .55s cubic-bezier(.2,.8,.2,1)}.truck{position:fixed;z-index:300;left:-120px;bottom:65px;font-size:58px;display:none;pointer-events:none}.truck.go{display:block;animation:truckgo 1.8s ease-in forwards}@keyframes truckgo{to{left:calc(100% + 120px)}}.success{position:fixed;inset:0;z-index:290;display:none;align-items:center;justify-content:center;background:#0008}.success.show{display:flex}.success-box{background:#fff;border-radius:18px;padding:25px;text-align:center;font-size:18px}.dark .success-box{background:#1d1d1f}
</style></head><body><div class="header"><div class="head-row"><div class="title">AziKom</div><div><button id="menuOpen" class="menu-btn">☰</button> <button id="adminOpen" class="admin-open">⚙️ Admin</button></div></div><input id="search" class="search" placeholder="Mahsulot qidirish..." autocomplete="off"></div><div id="categoryFilters" class="category-filters"></div><div id="products" class="products"><div class="loading">Mahsulotlar yuklanmoqda...</div></div><div class="bottom"><button id="cartButton" class="cart-button">Savat — 0 ta</button></div>
<div id="cartPage" class="cart-page"><div class="cart-head"><b>🛒 <span data-t="cart">Savat</span></b><button class="close" onclick="closeCart()">×</button></div><div id="cartList" class="cart-list"></div><div class="cart-footer"><button id="orderButton" class="order-btn" onclick="sendOrder()" data-t="order">Buyurtma berish</button></div></div>
<div id="menu" class="menu"><div class="menu-box"><button class="close" onclick="closeMenu()">×</button><h3>☰ Menu</h3><div class="menu-row"><b>🌐 <span data-t="language">Til</span></b><div class="langs"><button class="lang active" data-lang="uz">UZ</button><button class="lang" data-lang="ru">RU</button><button class="lang" data-lang="zh">中文</button></div></div><div class="menu-row"><b>🌙 <span data-t="theme">Rejim</span></b><button class="small-btn" onclick="toggleTheme()" id="themeBtn">🌙 Qora</button></div></div></div>
<div id="loginModal" class="modal"><div class="modal-box"><button class="close" onclick="closeModal('loginModal')">×</button><b>Admin kirish</b><input id="login" class="field" placeholder="Login"><input id="password" class="field" type="password" placeholder="Parol"><button class="primary" onclick="adminLogin()">Kirish</button><div id="loginError"></div></div></div>
<div id="adminModal" class="modal"><div class="modal-box"><button class="close" onclick="closeModal('adminModal')">×</button><b>Admin panel</b><div class="admin-tabs"><button id="tabCatalog" class="tab active" onclick="showAdminTab('catalog')">Katalog</button><button id="tabTrash" class="tab" onclick="showAdminTab('trash')">🗑 Chiqindi</button><button id="tabCategories" class="tab" onclick="showAdminTab('categories')">📂 Kategoriyalar</button></div><div id="catalogTab"><div><b>Yangi mahsulot</b><input id="newName" class="field" placeholder="Mahsulot nomi"><input id="newStock" class="field" type="number" min="0" placeholder="Qoldiq soni"><select id="newCategory" class="field"><option value="">Kategoriyasiz</option></select><input id="newPhoto" class="file" type="file" accept="image/*"><button class="primary" onclick="addProduct()">+ Mahsulot qo‘shish</button></div><div><b>Mahsulotlar</b><input id="adminSearch" class="field admin-search" placeholder="🔎 Tavar nomi bo‘yicha qidirish..."><div id="adminList" class="admin-list"></div></div></div><div id="trashTab" class="hidden"><div id="trashList" class="admin-list"></div></div><div id="categoriesTab" class="hidden"><b>Yangi kategoriya</b><input id="categoryName" class="field" placeholder="Kategoriya nomi"><button class="primary" onclick="createCategory()">+ Kategoriya yaratish</button><div id="categoryAdminList" class="admin-list" style="margin-top:12px"></div></div></div></div>
<div id="editModal" class="modal"><div class="modal-box"><button class="close" onclick="closeModal('editModal')">×</button><b>Mahsulotni tahrirlash</b><input id="editName" class="field"><input id="editStock" class="field" type="number" min="0"><select id="editCategory" class="field"><option value="">Kategoriyasiz</option></select><button class="primary" onclick="saveEdit()">Saqlash</button></div></div><div id="success" class="success"><div class="success-box">🚚<br><b data-t="success">Buyurtma yetkazishga chiqdi!</b></div></div><div id="truck" class="truck">🚚</div><div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand()}const API_BASE='https://xitoytavar.vercel.app';let products=[],categories=[],activeCategory=0;const cart={};let adminToken=localStorage.getItem('azikom_admin_token')||'',editId=0;const $=id=>document.getElementById(id);const T={uz:{language:'Til',theme:'Rejim',cart:'Savat',order:'Buyurtma berish',success:'Buyurtma yetkazishga chiqdi!',search:'Mahsulot qidirish...',empty:'Mahsulot topilmadi.',dark:'🌙 Qora',light:'☀️ Oq'},ru:{language:'Язык',theme:'Тема',cart:'Корзина',order:'Оформить заказ',success:'Заказ отправлен на доставку!',search:'Поиск товара...',empty:'Товар не найден.',dark:'🌙 Тёмная',light:'☀️ Светлая'},zh:{language:'语言',theme:'模式',cart:'购物车',order:'下单',success:'订单已送去配送！',search:'搜索商品...',empty:'未找到商品。',dark:'🌙 深色',light:'☀️ 浅色'}};let lang=localStorage.getItem('azikom_lang')||'uz';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(m){if(tg)tg.showAlert(m);else alert(m)}function openModal(id){$(id).classList.add('show')}function closeModal(id){$(id).classList.remove('show')}function closeMenu(){$('menu').classList.remove('show')}function setLang(l){lang=l;localStorage.setItem('azikom_lang',l);document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[l][e.dataset.t]||e.textContent);$('search').placeholder=T[l].search;document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));updateThemeText()}function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('azikom_theme',document.body.classList.contains('dark')?'dark':'light');updateThemeText()}function updateThemeText(){let d=document.body.classList.contains('dark');$('themeBtn').textContent=d?T[lang].light:T[lang].dark}if(localStorage.getItem('azikom_theme')==='dark')document.body.classList.add('dark');setLang(lang);
async function loadProducts(){try{const r=await fetch(API_BASE+'/api/products?t='+Date.now(),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error);products=d.products||[];renderCategories();renderProducts()}catch(e){$('products').innerHTML='<div class="error-box">Xatolik. Qayta urinib ko‘ring.</div>'}}
function renderCategories(){const cs=[...new Map(products.filter(p=>p.category_id&&p.category_name).map(p=>[+p.category_id,{id:+p.category_id,name:p.category_name}])).values()];$('categoryFilters').innerHTML='<button class="'+(!activeCategory?'active':'')+'" onclick="setCategory(0)">Barchasi</button>'+cs.map(c=>'<button class="'+(activeCategory===c.id?'active':'')+'" onclick="setCategory('+c.id+')">'+esc(c.name)+'</button>').join('')}function setCategory(id){activeCategory=id;renderCategories();renderProducts()}function renderProducts(){const s=$('search').value.toLowerCase().trim(),list=products.filter(p=>(!activeCategory||+p.category_id===activeCategory)&&String(p.name||'').toLowerCase().includes(s));if(!list.length){$('products').innerHTML='<div class="empty">'+T[lang].empty+'</div>';return}$('products').innerHTML=list.map(p=>{let q=+cart[p.id]||0,st=+p.stock_qty||0,img=API_BASE+'/api/image?file_id='+encodeURIComponent(p.photo_file_id);return `<div class="product" id="prod-${p.id}"><img class="product-image" src="${img}"><div class="product-info"><div class="product-name">${esc(p.name)}</div><div class="stock">Qoldiq: ${st} dona</div><div class="quantity"><button onclick="changeQuantity(${p.id},-1)">−</button><span class="quantity-value" data-q="${p.id}">${q}</span><button ${st<=0||q>=st?'disabled':''} onclick="changeQuantity(${p.id},1,this)">+</button></div></div></div>`}).join('');updateCartButton()}
function changeQuantity(id,c,btn){let p=products.find(x=>+x.id===+id);if(!p)return;let st=+p.stock_qty||0,old=+cart[id]||0,n=old+c;if(n<0||n>st)return;if(c>0&&btn)flyToCart(btn.closest('.product').querySelector('img'));if(n)cart[id]=n;else delete cart[id];let el=document.querySelector(`[data-q="${id}"]`);if(el)el.textContent=n;let plus=el?.closest('.quantity')?.querySelector('button:last-child');if(plus)plus.disabled=n>=st;updateCartButton()}
function flyToCart(img){let r=img.getBoundingClientRect(),f=img.cloneNode();f.className='fly-img';f.style.left=r.left+'px';f.style.top=r.top+'px';document.body.appendChild(f);requestAnimationFrame(()=>{let b=$('cartButton').getBoundingClientRect();f.style.left=b.left+b.width/2-40+'px';f.style.top=b.top-10+'px';f.style.width='30px';f.style.height='30px';f.style.opacity='0.3'});setTimeout(()=>f.remove(),650)}function updateCartButton(){$('cartButton').textContent='🛒 '+T[lang].cart+' — '+Object.values(cart).reduce((a,b)=>a+ +b,0)+' ta'}
function openCart(){if(!Object.keys(cart).length){toast('Avval mahsulot tanlang');return}renderCart();$('cartPage').classList.add('show')}function closeCart(){$('cartPage').classList.remove('show')}function renderCart(){$('cartList').innerHTML=Object.entries(cart).map(([id,q])=>{let p=products.find(x=>+x.id===+id);if(!p)return '';return `<div class="cart-item"><img src="${API_BASE}/api/image?file_id=${encodeURIComponent(p.photo_file_id)}"><div class="cart-item-main"><div class="cart-item-name">${esc(p.name)}</div><div class="cart-item-qty">${q} dona</div><div class="cart-qty"><button onclick="cartChange(${id},-1)">−</button><span>${q}</span><button onclick="cartChange(${id},1)">+</button></div></div></div>`}).join('')}function cartChange(id,c){changeQuantity(id,c);if(cart[id])renderCart();else{renderCart();if(!Object.keys(cart).length)closeCart()}}
async function sendOrder(){let items=Object.entries(cart).map(([id,q])=>({id:+id,quantity:+q}));if(!items.length)return;if(!tg?.initData){toast('Buyurtma Telegram orqali beriladi');return}$('orderButton').disabled=true;$('orderButton').textContent='Yuborilmoqda...';try{let r=await fetch(API_BASE+'/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items,initData:tg.initData})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Buyurtma yuborilmadi');Object.keys(cart).forEach(k=>delete cart[k]);closeCart();await loadProducts();updateCartButton();$('truck').classList.remove('go');void $('truck').offsetWidth;$('truck').classList.add('go');setTimeout(()=>$('success').classList.add('show'),1500);setTimeout(()=>$('success').classList.remove('show'),3500)}catch(e){await loadProducts();toast(e.message)}finally{$('orderButton').disabled=false;$('orderButton').textContent=T[lang].order}}
$('menuOpen').onclick=()=>$('menu').classList.add('show');document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));$('search').oninput=renderProducts;$('cartButton').onclick=openCart;
$('adminOpen').onclick=()=>adminToken?openAdmin():openModal('loginModal');async function adminLogin(){try{let r=await fetch(API_BASE+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('login').value.trim(),password:$('password').value})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error);adminToken=d.token;localStorage.setItem('azikom_admin_token',adminToken);closeModal('loginModal');openAdmin()}catch(e){$('loginError').textContent=e.message}}function authHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+adminToken}}async function adminFetch(url,opt={}){let r=await fetch(API_BASE+url,{...opt,headers:{...authHeaders(),...(opt.headers||{})}});if(r.status===401){adminToken='';localStorage.removeItem('azikom_admin_token');closeModal('adminModal');openModal('loginModal');throw Error('Sessiya tugagan')}let d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Xatolik');return d}function showAdminTab(t){$('catalogTab').classList.toggle('hidden',t!=='catalog');$('trashTab').classList.toggle('hidden',t!=='trash');$('categoriesTab').classList.toggle('hidden',t!=='categories');$('tabCatalog').classList.toggle('active',t==='catalog');$('tabTrash').classList.toggle('active',t==='trash');$('tabCategories').classList.toggle('active',t==='categories');if(t==='catalog')loadAdminList();else if(t==='trash')loadTrash();else loadCategories()}function openAdmin(){openModal('adminModal');loadCategories();showAdminTab('catalog')}
async function loadCategories(){try{const d=await adminFetch('/api/admin/categories');categories=d.categories||[];const opts='<option value="">Kategoriyasiz</option>'+categories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');['newCategory','editCategory'].forEach(id=>{const el=$(id);if(el){const v=el.value;el.innerHTML=opts;el.value=v}});$('categoryAdminList').innerHTML=categories.map(c=>'<div class="admin-card"><div class="admin-card-main"><input id="catname-'+c.id+'" class="field" value="'+esc(c.name)+'"><div class="stock">Tovarlar: '+c.product_count+'</div><div class="admin-actions"><button class="small-btn" onclick="renameCategory('+c.id+')">Saqlash</button><button class="small-btn danger" onclick="deleteCategory('+c.id+')">O‘chirish</button></div></div></div>').join('')||'<div class="empty">Kategoriya yo‘q</div>'}catch(e){$('categoryAdminList').textContent=e.message}}async function createCategory(){const name=$('categoryName').value.trim();if(!name)return toast('Kategoriya nomini kiriting');try{await adminFetch('/api/admin/categories',{method:'POST',body:JSON.stringify({name})});$('categoryName').value='';await loadCategories()}catch(e){toast(e.message)}}async function renameCategory(id){const name=$('catname-'+id).value.trim();if(!name)return toast('Nom kiriting');try{await adminFetch('/api/admin/categories?id='+id,{method:'PATCH',body:JSON.stringify({name})});await loadCategories();await loadProducts()}catch(e){toast(e.message)}}async function deleteCategory(id){if(!confirm('Kategoriyani o‘chirasizmi? Tovarlar kategoriyasiz qoladi.'))return;try{await adminFetch('/api/admin/categories?id='+id,{method:'DELETE'});if(activeCategory===id)activeCategory=0;await loadCategories();await loadAdminList();await loadProducts()}catch(e){toast(e.message)}}async function loadAdminList(){try{let d=await adminFetch('/api/admin/products'),a=(d.products||[]).filter(p=>!p.is_deleted),s=$('adminSearch').value.toLowerCase().trim();if(s)a=a.filter(p=>String(p.name||'').toLowerCase().includes(s));$('adminList').innerHTML=a.map(p=>adminCard(p)).join('')||'<div class="empty">Topilmadi</div>'}catch(e){$('adminList').textContent=e.message}}async function loadTrash(){try{let d=await adminFetch('/api/admin/products?trash=1'),a=(d.products||[]).filter(p=>p.is_deleted);$('trashList').innerHTML=a.map(p=>`<div class="admin-card"><img src="${API_BASE}/api/image?file_id=${encodeURIComponent(p.photo_file_id)}"><div class="admin-card-main"><div class="admin-name">${esc(p.name)}</div><button class="small-btn" onclick="restoreProduct(${p.id})">♻️ Tiklash</button><button class="small-btn danger" onclick="permanentDeleteProduct(${p.id})">🗑 Butunlay o‘chirish</button></div></div>`).join('')||'<div class="empty">Bo‘sh</div>'}catch(e){$('trashList').textContent=e.message}}function adminCard(p){return `<div class="admin-card"><img src="${API_BASE}/api/image?file_id=${encodeURIComponent(p.photo_file_id)}"><div class="admin-card-main"><div class="admin-name">${esc(p.name)}</div><div>ID: ${p.id}</div><div class="stock-edit">Qoldiq <input id="stock-${p.id}" class="stock-input" type="number" min="0" value="${+p.stock_qty||0}"><button class="small-btn" onclick="saveStock(${p.id})">Saqlash</button></div><div class="admin-actions"><button class="small-btn" onclick="openEdit(${p.id})">✏️ Tahrirlash</button><button class="small-btn danger" onclick="deleteProduct(${p.id})">🗑 O‘chirish</button></div></div></div>`}async function saveStock(id){let n=+$('stock-'+id).value;if(!Number.isSafeInteger(n)||n<0)return alert('Qoldiq noto‘g‘ri');await adminFetch('/api/admin/products?id='+id,{method:'PATCH',body:JSON.stringify({stock_qty:n})});await loadAdminList();await loadProducts()}async function deleteProduct(id){if(!confirm('Chiqindiga ko‘chirasizmi?'))return;await adminFetch('/api/admin/products?id='+id,{method:'DELETE'});await loadAdminList();await loadTrash();await loadProducts()}async function restoreProduct(id){await adminFetch('/api/admin/products?id='+id,{method:'PATCH',body:JSON.stringify({action:'restore'})});await loadAdminList();await loadTrash();await loadProducts()}async function permanentDeleteProduct(id){if(!confirm("Bu mahsulotni butunlay o‘chirasizmi? Qayta tiklab bo‘lmaydi."))return;try{await adminFetch('/api/admin/products?id='+id,{method:'DELETE',body:JSON.stringify({action:'permanent_delete'})});await loadTrash();await loadAdminList();await loadProducts()}catch(e){toast(e.message)}}async function openEdit(id){let d=await adminFetch('/api/admin/products'),p=(d.products||[]).find(x=>+x.id===+id);if(!p)return;editId=id;$('editName').value=p.name;$('editStock').value=p.stock_qty;await loadCategories();$('editCategory').value=p.category_id||'';openModal('editModal')}async function saveEdit(){let n=$('editName').value.trim(),s=+$('editStock').value;if(!n||!Number.isSafeInteger(s)||s<0)return;await adminFetch('/api/admin/products?id='+editId,{method:'PATCH',body:JSON.stringify({name:n,stock_qty:s,category_id:$('editCategory').value||null})});closeModal('editModal');await loadAdminList();await loadProducts()}function compressImage(file){return new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>{let i=new Image;i.onload=()=>{let sc=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*sc;c.height=i.height*sc;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}async function addProduct(){let n=$('newName').value.trim(),s=+$('newStock').value,f=$('newPhoto').files[0];if(!n||!f||!Number.isSafeInteger(s)||s<0)return alert('Nom, rasm va qoldiqni kiriting');let image=await compressImage(f),chatId=tg?.initDataUnsafe?.user?.id;if(!chatId)return;let up=await adminFetch('/api/admin/upload',{method:'POST',body:JSON.stringify({chat_id:String(chatId),image})});await adminFetch('/api/admin/products',{method:'POST',body:JSON.stringify({name:n,photo_file_id:up.photo_file_id,stock_qty:s,category_id:$('newCategory').value||null})});$('newName').value='';$('newStock').value='';$('newPhoto').value='';await loadAdminList();await loadProducts()}$('adminSearch').oninput=loadAdminList;loadProducts();
</script></body></html>
