')||'uz';let darkMode=localStorage.getItem('azikom_theme')==='dark';function t(k){return (translations[currentLang]||translations.uz)[k]||translations.uz[k]||k}function applyLanguage(){document.documentElement.lang=currentLang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));$('language').value=currentLang;renderCategories();renderProducts();updateCart();if($('cartOverlay').classList.contains('show'))renderCart();$('themeToggle').textContent=darkMode?'☀':'☾';$('themeToggle').setAttribute('aria-label',darkMode?'Light mode':'Dark mode')}function applyTheme(){document.body.classList.toggle('dark',darkMode);localStorage.setItem('azikom_theme',darkMode?'dark':'light');if(tg){try{tg.setHeaderColor(darkMode?'#151614':'#10100f');tg.setBackgroundColor(darkMode?'#151614':'#f5f2eb')}catch(e){}}$('themeToggle').textContent=darkMode?'☀':'☾'}$('language').addEventListener('change',e=>{currentLang=e.target.value;localStorage.setItem('azikom_lang',currentLang);applyLanguage()});$('themeToggle').addEventListener('click',()=>{darkMode=!darkMode;applyTheme();applyLanguage()});applyTheme();applyLanguage();
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600)}
async function load(){try{const r=await fetch(API+'/api/products?ts='+Date.now(),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||t('loadError'));products=d.products||[];renderCategories();renderProducts()}catch(e){$('products').innerHTML='<div class="empty">Katalogni yuklab bo‘lmadi. Internetni tekshirib, qayta urinib ko‘ring.</div>';toast(e.message)}}
function renderCategories(){const cats=[...new Map(products.filter(p=>p.category_id&&p.category_name).map(p=>[+p.category_id,{id:+p.category_id,name:p.category_name}])).values()];$('categories').innerHTML='<button class="cat '+(!activeCategory?'active':'')+'" onclick="setCategory(0)">'+t('all')+'</button>'+cats.map(c=>'<button class="cat '+(activeCategory===c.id?'active':'')+'" onclick="setCategory('+c.id+')">'+esc(c.name)+'</button>').join('')}
function setCategory(id){activeCategory=id;renderCategories();renderProducts()}
function normalize(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,' ').trim()}
function renderProducts(){const q=normalize($('search').value);let list=products.filter(p=>(!activeCategory||+p.category_id===activeCategory)&&(!q||normalize(p.name).includes(q)||String(p.name).toLowerCase().includes(q)));$('resultCount').textContent=list.length+' '+t('items');if(!list.length){$('products').innerHTML='<div class="empty">'+t('notFound')+'</div>';return}

function openImage(id){const p=products.find(x=>+x.id===+id);if(!p)return;const src=image(p);if(!src){toast(t('noImage'));return}$('viewerImage').src=src;$('viewerImage').alt=p.name;$('viewerCaption').textContent=p.name+' · '+money(p.price);$('imageViewer').classList.add('show')}function closeImage(){$('imageViewer').classList.remove('show');$('viewerImage').src=''}
function change(id,delta){const p=products.find(x=>+x.id===+id);if(!p)return;const n=(+cart[id]||0)+delta;if(n<0||n>(+p.stock_qty||0))return;if(n)cart[id]=n;else delete cart[id];const card=document.querySelector('[data-product-id="'+id+'"]');if(card){const bottom=card.querySelector('.product-bottom');if(bottom){const qty=n;bottom.innerHTML='<span class="price">'+money(p.price)+'</span>'+(+p.stock_qty>0?(qty?'<div class="qty"><button type="button" onclick="change('+p.id+',-1)">−</button><span>'+qty+'</span><button type="button" onclick="change('+p.id+',1)">+</button></div>':'<button type="button" class="addbtn" aria-label="Savatga qo‘shish" onclick="change('+p.id+',1)">+</button>'):'<span style="font-size:10px;color:#9b594e">Mavjud emas</span>')}}updateCart()}
function summary(){let count=0,total=0;Object.entries(cart).forEach(([id,q])=>{const p=products.find(x=>+x.id===+id);if(p){count+=q;total+=q*Number(p.price||0)}});return {count,total}}
function updateCart(){const s=summary();$('cartCount').textContent=s.count;$('bottomTotal').textContent=money(s.total);$('bottomItems').textContent=s.count+' '+t('items');$('bottomCart').classList.toggle('show',s.count>0);$('cartTotal').textContent=money(s.total);$('checkoutTotal').textContent=money(s.total)}
function openCart(){renderCart();$('cartOverlay').classList.add('show')}function closeCart(){$('cartOverlay').classList.remove('show')}
function renderCart(){const entries=Object.entries(cart).filter(([id,q])=>q>0&&products.some(p=>+p.id===+id));if(!entries.length){$('cartRows').innerHTML='<div class="empty">'+t('cartEmpty')+'</div>';$('goCheckout').disabled=true}else{$('goCheckout').disabled=false;$('cartRows').innerHTML=entries.map(([id,q])=>{const p=products.find(x=>+x.id===+id),src=image(p);return '<div class="cartrow">'+(src?'<img src="'+src+'" alt="">':'<div class="product-placeholder">✧</div>')+'<div><b>'+esc(p.name)+'</b><small>'+money(p.price)+' / dona · '+money(p.price*q)+'</small><div class="qty"><button onclick="change('+id+',-1);renderCart()">−</button><span>'+q+'</span><button onclick="change('+id+',1);renderCart()">+</button></div></div><b>'+money(p.price*q)+'</b></div>'}).join('')}updateCart()}
function showCheckout(){if(!summary().count)return;closeCart();$('checkoutTotal').textContent=money(summary().total);if(tg?.initDataUnsafe?.user){const u=tg.initDataUnsafe.user;$('name').value=[u.first_name,u.last_name].filter(Boolean).join(' ')}$('checkoutOverlay').classList.add('show');if(!tg?.initData){$('telegramHint').textContent=t('needTelegram')}}
function closeCheckout(){$('checkoutOverlay').classList.remove('show')}
async function submitCheckout(e){e.preventDefault();if(!tg?.initData){toast(t('needTelegram'));return}const customer={name:$('name').value.trim(),shop:$('shop').value.trim(),address:$('address').value.trim(),phone:$('phone').value.trim()};const items=Object.entries(cart).filter(([id,q])=>q>0).map(([id,q])=>({id:Number(id),quantity:Number(q)}));const btn=$('submitBtn');btn.disabled=true;btn.textContent=t('sending');try{const r=await fetch(API+'/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items,initData:tg.initData,customer})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||t('sendError'));cart={};closeCheckout();await load();updateCart();toast(t('success'));if(tg?.HapticFeedback)tg.HapticFeedback.notificationOccurred('success')}catch(err){toast(err.message)}finally{btn.disabled=false;btn.textContent=t('send')}}
